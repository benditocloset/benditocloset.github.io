<style>
:root{--bg:#FAF6F0;--ink:#1C1517;--muted:#6F625C;--line:#E2D8CC;--gold:#9C6B22;--display:"Bodoni Moda",Didot,Georgia,serif;--body:"Jost","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:300 16px/1.55 var(--body)}
header{background:#0a0809;text-align:center;padding:14px 0}header img{width:130px;height:auto}
.wrap{max-width:600px;margin:0 auto;padding:34px 22px 60px}
.k{font:500 10px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
h1{font:400 clamp(34px,9vw,48px)/1.05 var(--display);margin:12px 0 14px}
h2{font:400 24px/1.2 var(--display);margin:0 0 6px}
p{margin:0 0 14px}.mut{color:var(--muted);font-size:14.5px}
label{display:block;font:500 10.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;margin:18px 0 8px}
input,textarea{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:10px 0;font:300 17px var(--body);color:var(--ink);border-radius:0}
textarea{border:1px solid var(--line);padding:10px;min-height:90px}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:15px 26px;font:500 11px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;margin:22px 10px 0 0;text-decoration:none}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:15px 26px}
.btn{-webkit-appearance:none;appearance:none;border-radius:0;white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:wait}
div.o,section.o{border-top:1px solid var(--line);padding:24px 0}
.o .st{font:500 10px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:10px 0}
.msg{border:1px solid var(--ink);padding:16px;margin:20px 0;background:#fff}
.err{color:#8a1c1c;font-size:14.5px;margin-top:12px}
.lang{display:flex;gap:14px;justify-content:center;margin-top:10px}.lang button{background:none;border:0;color:#cbbfb3;font:500 10.5px var(--body);letter-spacing:.2em;cursor:pointer}.lang button[aria-pressed=true]{color:#E6C68C}
a{color:inherit}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="/maison.css?v=97">
<script>(function(){var H=document.documentElement,on=true;try{var q=location.search;if(/[?&]estilo=maison/.test(q)){localStorage.removeItem('bc-estilo');}if(/[?&]estilo=0/.test(q)){localStorage.setItem('bc-estilo','antigo');}if(localStorage.getItem('bc-estilo')==='antigo'){on=false;}}catch(e){}if(!on)return;H.classList.add('maison');document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('img[src*="logo.jpg"],img[src*="14-logo-bendito"],img[src*="logo-bc"]').forEach(function(i){if(i.closest('main article,.grid,.fotos'))return;i.src='/img/logo-maison-cor.png';i.removeAttribute('width');i.removeAttribute('height');i.classList.add('mlogo');});});})();</script>

 fr:{errAct:"Impossible de finaliser pour le moment. Réessayez bientôt ou envoyez-nous votre demande ci-dessous.",k:"Commandes",h:"Ma commande",intro:"Ici, vous pouvez annuler une commande pas encore expédiée ou demander le retour d'une pièce reçue. Tout sur le site.",email:"E-mail utilisé pour l'achat",l4:"4 derniers chiffres de la carte",find:"Rechercher",nocard:"Payé avec MB WAY, Multibanco ou Klarna ? Utilisez le lien « Voir, annuler ou retourner la commande » affiché après le paiement, ou envoyez-nous votre demande avec le formulaire ci-dessous.",none:"Aucune commande trouvée avec ces données ces 30 derniers jours.",err:"Recherche impossible pour le moment. Réessayez dans un instant.",ref:"Commande",tot:"Total",stOpen:"En préparation",stSent:"Expédiée",stRet:"Retour demandé",stRef:"Remboursée",cancel:"Annuler la commande",ret:"Demander un retour",conf:t=>`Annuler la commande et rembourser ${t} sur votre carte ?`,why:"Motif du retour (facultatif)",send:"Confirmer le retour",okCancel:t=>`Commande annulée. Le remboursement de ${t} a été fait sur votre moyen de paiement et apparaît sous 5 à 10 jours ouvrés.`,okRet:"Demande de retour enregistrée. Comment retourner : 1) utilisez l'étiquette de retour glissée dans le colis (aussi envoyée par e-mail) ; 2) déposez la pièce chez CTT ou Correos Express sous 14 jours après réception — les frais de retour sont à votre charge ; 3) à réception, nous vous remboursons. Elle doit revenir dans le même état, avec son étiquette s'il y en a une.",sentNo:"Cette commande a déjà été expédiée et ne peut plus être annulée. Vous pourrez demander un retour à réception.",late:"Le délai de retour de cette commande est dépassé.",ajT:"Besoin d'autre chose ?",ajP:"Écrivez-nous ici, nous répondons par e-mail.",ajM:"Message",ajB:"Envoyer",ajOk:"Message envoyé. Nous répondons bientôt par e-mail."},

let L = (()=>{ try{ const q=new URLSearchParams(location.search).get("lang"); if(T[q]) return q; const s=localStorage.getItem("bc-lang"); if(T[s]) return s; }catch(e){} const n=(navigator.language||"pt").slice(0,2); return T[n]?n:"pt"; })();
const t = () => T[L];
const eur = v => v.toFixed(2).replace(".", ",") + " €";
function paint(){ document.documentElement.lang=L; document.querySelectorAll("[data-t]").forEach(e=>{const v=t()[e.dataset.t]; if(typeof v==="string") e.textContent=v;}); document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===L)); if(LAST) show(LAST); }
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l; try{localStorage.setItem("bc-lang",L)}catch(e){} paint();});
let LAST = null;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(list){
  LAST = list; const r = document.getElementById("res"); r.hidden = false;
  if (!list.length) { r.innerHTML = `<p class="msg">${t().none}</p>`; return; }
  r.innerHTML = list.map((o,i)=>{
    const st = o.reembolso==="total" ? t().stRef : o.devolucao ? t().stRet : o.enviada ? t().stSent : t().stOpen;
    let acts = "";
    if (o.reembolso!=="total" && !o.devolucao) {
      if (!o.enviada) acts += `<button class="btn" data-a="cancelar" data-i="${i}">${t().cancel}</button>`;
      acts += `<button class="btn o" data-a="abrir" data-i="${i}">${t().ret}</button>`;
    }
    return `<div class="o"><h2>${t().ref} ${esc(o.ref)}</h2><div class="st">${st}</div><p>${esc(o.pecas)}</p><p class="mut">${esc(o.data)} · ${t().tot}: ${eur(o.total)}</p>${acts}<div class="dv" id="dv${i}" hidden><label for="mt${i}">${t().why}</label><textarea id="mt${i}"></textarea><button class="btn" data-a="devolver" data-i="${i}">${t().send}</button></div><div id="m${i}"></div></div>`;
  }).join("");
}
async function post(path, body){ const r = await fetch(W+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); const o = await r.json().catch(()=>({})); return {ok:r.ok, o}; }
function avisar(o, assunto, extra){
  const d = {_subject: assunto + " · " + o.ref, _template:"table", _captcha:"false", "Encomenda": o.ref, "Peças": o.pecas, "Total": eur(o.total), "Cliente": o.nome, "E-mail": o.email, "Data da compra": o.data, ...extra};
  if (o.email) d._cc = o.email;
  fetch(FS,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)}).catch(()=>{});
}
document.getElementById("res").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const i = +b.dataset.i, o = LAST[i], m = document.getElementById("m"+i), a = b.dataset.a;
  if (a==="abrir") { document.getElementById("dv"+i).hidden = false; b.hidden = true; return; }
  if (a==="cancelar" && !confirm(t().conf(eur(o.total)))) return;
  b.disabled = true;
  const motivo = a==="devolver" ? document.getElementById("mt"+i).value.trim() : "";
  const {ok, o:res} = await post("/encomenda/acao", {id:o.id, tok:o.tok, acao:a, motivo});
  b.disabled = false;
  if (!ok) { m.innerHTML = `<p class="err">${res.error==="ja_enviada"?t().sentNo:res.error==="prazo"?t().late:t().errAct}</p>`; return; }
  if (res.estado==="cancelada") { o.reembolso="total"; avisar(o, "Encomenda cancelada e reembolsada", {"Reembolso": eur(o.total)}); show(LAST); document.getElementById("m"+i).innerHTML = `<p class="msg">${t().okCancel(eur(o.total))}</p>`; }
  else if (res.estado==="devolucao_pedida") { o.devolucao="pedida"; avisar(o, "Pedido de devolução", {"Motivo": motivo || "(não indicado)", "Próximo passo": "Enviar à cliente a morada para a devolução. Quando a peça chegar, abrir a página de gestão e carregar em Peça recebida."}); show(LAST); document.getElementById("m"+i).innerHTML = `<p class="msg">${t().okRet}</p><a class="btn o" target="_blank" rel="noopener" href="${W}/etiqueta?id=${encodeURIComponent(o.id)}&tok=${o.tok}">${({pt:"Etiqueta de devolução",en:"Return label",es:"Etiqueta de devolución",fr:"Étiquette de retour",de:"Rücksendeetikett",it:"Etichetta di reso"})[L]}</a>`; }
  else { o.reembolso="total"; show(LAST); }
});
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); const err = document.getElementById("ferr"); err.hidden = true;
  const btn = e.target.querySelector("button"); btn.disabled = true;
  const {ok, o} = await post("/encomenda/procurar", {email:document.getElementById("em").value, last4:document.getElementById("l4").value});
  btn.disabled = false;
  if (!ok) { err.textContent = t().err; err.hidden = false; return; }
  show(o.encomendas||[]); document.getElementById("res").scrollIntoView({behavior:"smooth"});
});
document.getElementById("fa").addEventListener("submit", async e => {
  e.preventDefault();
  const d = {_subject:"Pedido de ajuda com uma encomenda", _template:"table", _captcha:"false", "E-mail": document.getElementById("aem").value, "Mensagem": document.getElementById("amsg").value, _cc: document.getElementById("aem").value};
  await fetch(FS,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)}).catch(()=>{});
  document.getElementById("aok").hidden = false; e.target.querySelectorAll("button").forEach(b=>b.hidden=true);
});
{ const LC={pt:"Tem conta? Entre para ver todas as suas encomendas sem procurar",en:"Have an account? Sign in to see all your orders",es:"¿Tienes cuenta? Entra para ver todos tus pedidos",fr:"Vous avez un compte ? Connectez-vous pour voir toutes vos commandes",de:"Sie haben ein Konto? Melden Sie sich an, um alle Bestellungen zu sehen",it:"Hai un account? Accedi per vedere tutti i tuoi ordini"}; const f=()=>{ const a=document.getElementById("lconta"); if(a) a.textContent=(LC[L]||LC.pt)+" →"; }; f(); document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",f)); }
paint();
(async()=>{ let ss = ""; try { ss = localStorage.getItem("bc-sessao") || ""; } catch(e){}
  if (ss && !new URLSearchParams(location.search).get("s")) { const {ok,o} = await post("/conta/eu", {sessao:ss}); if (ok) { show(o.encomendas||[]); return; } } })();
(async()=>{ let s = new URLSearchParams(location.search).get("s"); if (!s) { try { if (localStorage.getItem("bc-sessao")) return; } catch(e){} } if (!s) { try { s = localStorage.getItem("bc-ultima-encomenda"); } catch(e){} }
  if (s && /^cs_/.test(s)) { const {ok,o} = await post("/encomenda/procurar", {s}); if (ok) show(o.encomendas||[]); } })();
</script>
