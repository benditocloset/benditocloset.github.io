<style>
  :root { --gold:#c9a36a; --cream:#ece2d2; --rose:#9E1B3F; --line:rgba(201,163,106,.35); --soft:#b8ab97; --card:#121012; }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:var(--cream); font:400 16px/1.6 Montserrat, system-ui, sans-serif; }
  a { color:var(--gold); }
  header { text-align:center; padding:22px 20px 0; }
  header img { width:min(220px, 56vw); height:auto; }
  .top { max-width:1100px; margin:0 auto; padding:0 20px; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .top a { text-decoration:none; }
  .intro { text-align:center; max-width:640px; margin:10px auto 30px; padding:0 20px; }
  .eyebrow { letter-spacing:.32em; text-transform:uppercase; color:var(--gold); font-size:12px; font-weight:600; }
  h1 { font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; color:#fff; font-size:clamp(40px,7vw,60px); line-height:1.05; margin:10px 0 10px; }
  h1 em { color:var(--gold); font-style:italic; }
  .intro p { color:var(--soft); margin:0; }
  main { max-width:1100px; margin:0 auto; padding:0 20px 60px; display:grid; gap:56px; }
  .look { display:grid; grid-template-columns:1.05fr 1fr; gap:36px; align-items:start; border-top:1px solid var(--line); padding-top:40px; }
  .look:first-child { border-top:0; padding-top:0; }
  .look .img { border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .look .img img { width:100%; height:auto; display:block; }
  .look h2 { font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; color:#fff; font-size:40px; margin:6px 0 4px; line-height:1.1; }
  .look .date { color:var(--gold); font-size:12px; letter-spacing:.2em; text-transform:uppercase; }
  .look .txt { color:var(--soft); margin:6px 0 22px; }
  .pecas { display:grid; gap:14px; }
  .peca { display:grid; grid-template-columns:96px 1fr; gap:16px; align-items:center; background:var(--card); border:1px solid #2a2326; border-radius:10px; padding:12px; text-decoration:none; color:inherit; transition:border-color .2s; }
  .peca:hover { border-color:var(--gold); }
  .peca img { width:96px; height:120px; object-fit:cover; border-radius:6px; }
  .peca small { display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
  .peca b { display:block; font-family:"Cormorant Garamond", Georgia, serif; font-size:22px; font-weight:600; color:#fff; line-height:1.15; margin:2px 0 6px; }
  .peca .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .peca .pr { font-family:"Cormorant Garamond", Georgia, serif; font-size:22px; font-weight:700; color:var(--cream); }
  .peca .btn { background:var(--rose); color:#fff; font-size:13px; font-weight:600; padding:7px 14px; border-radius:8px; }
  .peca.sold { opacity:.55; pointer-events:none; }
  .peca.sold .btn { background:#333; }
  .note { font-size:12.5px; color:#8f8580; margin-top:14px; }
  .cta { text-align:center; padding:10px 20px 50px; }
  .cta a.big { display:inline-block; background:var(--gold); color:#111; font-weight:600; text-decoration:none; padding:14px 26px; border-radius:10px; }
  footer { text-align:center; color:#7d746f; font-size:13px; padding:0 20px 40px; }
  @media (max-width:820px){ .look { grid-template-columns:1fr; gap:22px; } }

<footer>Bendito Closet · moda de marca em segunda mão · <a href="https://www.instagram.com/benditocloset.pt/">@benditocloset.pt</a></footer>

<script>
/* LOOKS: o mais recente primeiro. "pecas" usa os ids da lista PECAS da loja (index.html).
   O preço e o estado (vendido) vêm sempre da loja, por isso atualizam-se sozinhos. */
const LOOKS = [
  { id:"casual-chic", titulo:"Casual chic", data:"22 de novembro", img:"/looks/img/casual-chic.jpg",
    texto:"Conforto, estilo e um toque de cor: casaco vermelho, base neutra e espadrilles que fazem toda a gente perguntar onde as comprei.",
    pecas:["zara-casaco-vermelho","ch-espadrilles-tartan"],
    nota:"As restantes peças e a bolsa da foto são só styling e não estão à venda." }
];

const euro = n => n.toLocaleString("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
function pintar(P){
  const byId = Object.fromEntries((P||[]).map(p => [p.id,p]));
  document.getElementById("looks").innerHTML = LOOKS.map(l => `
    <article class="look" id="${l.id}">
      <div class="img"><img src="${l.img}" alt="Look ${l.titulo}" loading="lazy"></div>
      <div>
        <div class="date">${l.data}</div>
        <h2>${l.titulo}</h2>
        <p class="txt">${l.texto}</p>
        <div class="pecas">${l.pecas.map(id => { const p = byId[id]; if (!p) return "";
          const foto = (p.fotos||[p.foto])[0]; const sold = p.status === "vendido";
          return `<a class="peca${sold?" sold":""}" href="/?peca=${encodeURIComponent(id)}">
            <img src="/${foto}" alt="${p.nome}" loading="lazy">
            <div><small>${p.marca}</small><b>${p.nome}</b>
              <div class="row"><span class="pr">${euro(p.preco)}</span><span class="btn">${sold?"Vendido":"Ver e comprar"}</span></div></div>
          </a>`; }).join("")}</div>
        ${l.nota?`<p class="note">${l.nota}</p>`:""}
      </div>
    </article>`).join("");
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}
fetch("/", {cache:"no-store"}).then(r => r.text()).then(html => {
  const m = html.match(/const PECAS = (\[[\s\S]*?\n\]);/);
  pintar(m ? new Function("return " + m[1])() : []);
}).catch(() => pintar([]));
</script>
